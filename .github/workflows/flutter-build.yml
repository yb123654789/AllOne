name: Build & Release AllOne

# 云编译 + 自动发布：
#   - 推送 main：构建 Windows / Android 产物，上传到 Actions Artifacts（供下载）
#   - 推送 v* 标签（如 v1.0.0）：构建并自动发布到 GitHub Releases
#   - 也可在 Actions 页手动触发（workflow_dispatch）
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: # 手动触发

# 发布到 Releases 需要写权限
permissions:
  contents: write

jobs:
  # —— Windows 桌面版 ——
  build-windows:
    name: 构建 Windows 桌面版
    runs-on: windows-latest # 自带 Visual Studio 工具链
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Windows 版
        run: flutter build windows --release

      - name: 打包 Release 目录（zip）
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath AllOne-Windows.zip
        shell: pwsh

      - name: 上传产物（Actions Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: AllOne-Windows
          path: build/windows/x64/runner/Release/AllOne-Windows.zip

      - name: 发布到 GitHub Releases（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/x64/runner/Release/AllOne-Windows.zip

  # —— Android APK ——
  build-android:
    name: 构建 Android APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'

      - name: 获取依赖
        run: flutter pub get

      # 修复插件 file_picker 硬编码 compileSdk 34 的问题（与 compileSdk 36 冲突）
      - name: 修复 file_picker compileSdk
        run: |
          sed -i 's/compileSdk 34/compileSdk 36/' \
            $HOME/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle

      - name: 构建 Android APK
        run: flutter build apk --release

      - name: 上传产物（Actions Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: AllOne-Android
          path: build/app/outputs/flutter-apk/*.apk

      - name: 发布到 GitHub Releases（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
