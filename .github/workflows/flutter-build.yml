name: Build & Release AllOne

# 云编译 + 自动发布：
#   - 推送 main：构建 Windows / Android 产物，上传到 Actions Artifacts（供下载）
#   - 推送 v* 标签（如 v1.0.0）：构建并自动发布到 GitHub Releases
#   - 也可在 Actions 页手动触发（workflow_dispatch）
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: # 手动触发；ref 可填已有标签（如 v1.2.0）以补齐该发布的产物

# 发布到 Releases 需要写权限
permissions:
  contents: write

jobs:
  # —— Windows 桌面版 ——
  build-windows:
    name: 构建 Windows 桌面版
    runs-on: windows-latest # 自带 Visual Studio 工具链
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Windows 版
        run: flutter build windows --release

      - name: 打包 Release 目录（zip）
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath AllOne-Windows.zip
        shell: pwsh

      # —— 安装包（Inno Setup）——
      - name: 安装 Inno Setup
        run: |
          # choco 会往 stderr 输出警告，而 GHA 的 pwsh 步骤默认
          # $ErrorActionPreference='stop'，会把警告当成失败，这里放宽
          $ErrorActionPreference = 'Continue'
          choco install innosetup --no-progress -y
          # 只要 ISCC 到位就算成功（choco 的退出码在已安装等情况下不可靠）
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup 安装失败：找不到 ISCC.exe"; exit 1 }
          Write-Host "ISCC 就绪: $iscc"
        shell: pwsh

      - name: 构建 Windows 安装包
        run: |
          # choco 安装后的标准路径；显式写全路径避免 PATH 未刷新
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            Write-Error "找不到 ISCC.exe，Inno Setup 可能未安装成功"
            exit 1
          }
          Write-Host "使用编译器: $iscc"
          & $iscc "installer\AllOne_setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "installer\output" | Select-Object Name, Length
        shell: pwsh

      - name: 上传产物（Actions Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: AllOne-Windows
          path: |
            build/windows/x64/runner/Release/AllOne-Windows.zip
            installer/output/AllOne_Setup_*.exe

      - name: 发布到 GitHub Releases（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows/x64/runner/Release/AllOne-Windows.zip
            installer/output/AllOne_Setup_*.exe

  # —— Android APK ——
  build-android:
    name: 构建 Android APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'

      - name: 获取依赖
        run: flutter pub get

      # 修复插件 file_picker 硬编码 compileSdk 34 的问题（与 compileSdk 36 冲突）
      - name: 修复 file_picker compileSdk
        run: |
          sed -i 's/compileSdk 34/compileSdk 36/' \
            $HOME/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle

      - name: 构建 Android APK
        run: flutter build apk --release

      - name: 上传产物（Actions Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: AllOne-Android
          path: build/app/outputs/flutter-apk/*.apk

      - name: 发布到 GitHub Releases（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
